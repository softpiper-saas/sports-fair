groups:
  - name: sportsfair-infrastructure
    rules:
      - alert: SportsfairTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target is down"
          description: "{{ $labels.job }} target {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: SportsfairHighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage on {{ $labels.instance }} has stayed above 85% for 10 minutes."

      - alert: SportsfairHighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage on {{ $labels.instance }} has stayed above 90% for 10 minutes."

      - alert: SportsfairLowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})) * 100 > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Disk usage on {{ $labels.instance }} {{ $labels.mountpoint }} is above 85%."

      - alert: SportsfairContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Container restarted"
          description: "Container {{ $labels.name }} restarted within the last 15 minutes."
