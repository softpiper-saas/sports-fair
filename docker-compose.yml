services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sportsfair}:${POSTGRES_PASSWORD:-sportsfair}@db:5432/${POSTGRES_DB:-sportsfair}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportsfair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportsfair}
      POSTGRES_DB: ${POSTGRES_DB:-sportsfair}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportsfair} -d ${POSTGRES_DB:-sportsfair}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  node_modules:
  next_cache:
  postgres_data:
